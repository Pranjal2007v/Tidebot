[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tidebot"
version = "0.1.0"
description = "A maintainer's assistant for GitHub."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "fastapi>=0.100", "httpx>=0.24", "PyJWT[crypto]>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["tidebot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
